# The xiao_ble/nrf52840/zmk board's own defconfig already sets
# CONFIG_ZMK_BLE=y and CONFIG_ZMK_USB=y, so this PoC works over BLE (and
# over USB when plugged in) with no extra settings here.

# Uncomment to also enable ZMK Studio (live keymap editing over USB) later:
# CONFIG_ZMK_STUDIO=y

# Uncomment to enable deep sleep after inactivity, useful when running from
# the LiPo battery to save power:
# CONFIG_ZMK_SLEEP=y

# The left half is the central: it connects to the host and to the right half.

# Read the right half's battery level and report it to the host alongside the
# left half's own.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Mouse buttons (&mkp) on the left inner column. Only the central sends HID
# reports, so this is not needed on the right half. If the host was paired
# over BLE before this was enabled, re-pair it so the host picks up the new
# HID descriptor.
CONFIG_ZMK_POINTING=y

# Deep sleep after 15 minutes without a key press on either half, to save the
# LiPo battery (keep it the same in optokbd_right.conf). Pressing a key on this
# half wakes it up; that key press itself is not sent. While on USB power it
# never sleeps.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment to enable ZMK Studio (live keymap editing over USB); also add
# `snippet: studio-rpc-usb-uart` to the optokbd_left entry in build.yaml.
# CONFIG_ZMK_STUDIO=y

# The right half is a peripheral: it only connects to the left half.

# Deep sleep after 15 minutes without a key press on this half, to save the
# LiPo battery (keep it the same in optokbd_left.conf). Pressing a key on this
# half wakes it up and it reconnects to the left half; that key press itself
# is not sent. While on USB power it never sleeps.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
